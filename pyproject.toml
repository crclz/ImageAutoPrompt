[project]
name = "imageautoprompt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.5",
    "flask>=3.1.3",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "modelscope>=1.35.1",
    "more-itertools>=10.8.0",
    "openai>=2.30.0",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "requests>=2.32.5",
    "sentence-transformers>=5.3.0",
    "shortuuid>=1.0.13",
    "toml>=0.10.2",
    "torch>=2.10.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true  # 关键：防止其他包误用这个源

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
