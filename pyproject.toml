[project]
name = "imageautoprompt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "more-itertools>=10.8.0",
    "openai>=2.30.0",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "ruff>=0.16.3",
    "shortuuid>=1.0.13",
    "toml>=0.10.2",
]

# RAG 重组（torch 无代码直接依赖，仅 sentence-transformers 的传递依赖；chromadb / sentence-transformers 是 rag_service 内的 lazy import，不装时 server 正常启动，仅 RAG 功能不可用）
[dependency-groups]
rag = [
    "chromadb>=1.5.5",
    "modelscope>=1.35.1",
    "sentence-transformers>=5.3.0",
    "torch>=2.10.0",
]

[tool.uv]
default-groups = ["rag"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true  # 关键：防止其他包误用这个源

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
