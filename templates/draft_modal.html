<div v-if="showDraftModal"
    class="fixed inset-0 z-[150] flex items-center justify-center bg-black/70 backdrop-blur-md px-4"
    @click.self="showDraftModal = false">

    <div class="bg-white w-[90%] h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-white/20">

        <div class="px-8 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
            <div>
                <h3 class="text-xl font-black text-gray-900 tracking-tight">Timestep Draft</h3>
                <p class="text-xs text-gray-500 font-medium uppercase tracking-widest mt-0.5">Image Processing Pipeline
                </p>
            </div>
            <button @click="showDraftModal = false"
                class="p-2 hover:bg-gray-200 rounded-full transition-colors text-gray-400 hover:text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="flex-1 p-8 flex flex-col min-h-0">
            <label class="block text-sm font-bold text-indigo-600 mb-3 uppercase tracking-wider flex items-center">
                <span class="mr-2">Timestep Draft Content</span>
                <span class="h-[1px] flex-1 bg-indigo-100"></span>
            </label>

            <textarea v-model="draftContent"
                class="flex-1 w-full p-6 border-2 border-gray-100 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 font-mono text-base leading-relaxed resize-none bg-gray-50/30 shadow-inner"
                placeholder="在此处粘贴 timestep draft 内容... 文本框已扩容至 90% 宽度"></textarea>
        </div>

        <div class="px-8 py-5 bg-gray-50 border-t border-gray-100 flex justify-end items-center space-x-4">
            <span class="text-xs text-gray-400 font-mono mr-auto">CHARS: [[ draftContent.length ]]</span>

            <button @click="showDraftModal = false"
                class="px-6 py-2.5 text-sm font-bold text-gray-500 hover:text-gray-700 transition-colors uppercase tracking-widest">
                Cancel
            </button>

            <button @click="submitDraft" :disabled="isSubmittingDraft"
                class="px-10 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white text-sm font-black rounded-xl shadow-[0_4px_20px_rgba(79,70,229,0.3)] transition-all flex items-center active:scale-95 uppercase tracking-widest">
                <template v-if="isSubmittingDraft">
                    <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Processing...
                </template>
                <span v-else>Submit & Process</span>
            </button>
        </div>
    </div>
</div>


<div v-if="startImageProcessingDetailMsg"
    class="fixed inset-0 z-[250] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[80vh] flex flex-col border border-red-100">
        <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-red-50 rounded-t-xl">
            <h3 class="text-red-700 font-bold flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                        clip-rule="evenodd"></path>
                </svg>
                这并非报错信息，请粘贴给大模型
            </h3>
            <button @click="startImageProcessingDetailMsg = ''"
                class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <div class="p-6 overflow-y-auto">
            <pre
                class="whitespace-pre-wrap text-sm text-gray-700 bg-gray-50 p-4 rounded border border-gray-200 font-mono select-text">[[ startImageProcessingDetailMsg ]]</pre>
        </div>
        <div class="p-4 border-t border-gray-100 flex justify-end">
            <button @click="copyToClipboard(startImageProcessingDetailMsg)"
                class="mr-2 px-4 py-2 text-xs font-bold text-indigo-600 hover:bg-indigo-50 rounded-md">复制全文</button>
            <button @click="startImageProcessingDetailMsg = ''"
                class="px-4 py-2 bg-gray-800 text-white rounded-md text-xs font-bold hover:bg-gray-700">关闭</button>
        </div>
    </div>
</div>
