{% extends "layout.html" %}

{% block title %}Episode - {{ episode_name }}{% endblock %}

{% block content %}
<div id="app" class="max-w-5xl mx-auto p-4">
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow-sm">
        <h2 class="text-xl font-bold text-gray-800">
            Episode: <span class="text-indigo-600">[[ episodeName ]]</span>
        </h2>
        <div class="flex items-center space-x-2">
            <span class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </span>
            <span class="text-sm text-gray-500">每 2 秒自动同步</span>
        </div>
    </div>

    <div class="space-y-6">
        <div v-for="step in reversedTimesteps" :key="step.i" 
             class="bg-white border border-gray-100 rounded-xl shadow-sm p-4 transition-all hover:shadow-md">
            
            <div class="flex items-center mb-3 border-b border-gray-50 pb-2">
                <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-mono font-bold">
                    STEP [[ step.i ]]
                </span>
                <span class="ml-3 text-sm text-gray-400">状态: [[ step.status ]]</span>
            </div>

            <div class="flex flex-wrap gap-4">
                <div v-for="img in step.images" :key="img.image_index" class="relative group">
                    <img :src="img.url" 
                         class="h-32 w-auto rounded-lg object-cover border border-gray-200 shadow-sm transition-transform group-hover:scale-105"
                         @error="handleImgError">
                    <span class="absolute bottom-1 right-1 bg-black/50 text-white text-[10px] px-1 rounded">
                        #[[ img.image_index ]]
                    </span>
                </div>
                
                <div v-if="step.images.length === 0" class="text-gray-300 italic text-sm py-4">
                    无图片数据
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const { createApp, ref, onMounted, onUnmounted, computed } = Vue;

    createApp({
        setup() {
            const episodeName = ref("{{ episode_name }}");
            const timesteps = ref([]);
            let timer = null;

            // 计算属性：将 timesteps 倒序排列（timestep[-1] 在前）
            const reversedTimesteps = computed(() => {
                return [...timesteps.value].reverse();
            });

            // 获取数据
            const fetchData = async () => {
                try {
                    const response = await fetch(`/api/episodes/${episodeName.value}`);
                    if (!response.ok) throw new Error('网络请求失败');
                    const data = await response.json();
                    
                    // 假设 API 返回结构是 { timesteps: [...] }
                    timesteps.value = data.timesteps || [];
                } catch (err) {
                    console.error("加载失败:", err);
                }
            };

            const handleImgError = (e) => {
                e.target.src = 'https://placehold.co/200x200?text=Error';
            };

            onMounted(() => {
                // 1. 初始加载
                fetchData();
                // 2. 开启每2秒轮询
                timer = setInterval(fetchData, 2000);
            });

            onUnmounted(() => {
                // 组件卸载时销毁定时器，防止内存泄漏
                if (timer) clearInterval(timer);
            });

            return {
                episodeName,
                timesteps,
                reversedTimesteps,
                handleImgError
            };
        },
        delimiters: ['[[', ']]']
    }).mount('#app');
</script>
{% endblock %}
