{% extends "layout.html" %}

{% block title %}Episode List{% endblock %}

{% block content %}
<div id="app" class="p-5 font-sans bg-gray-50 min-h-screen">
    <div class="flex justify-between items-center mb-6 max-w-4xl mx-auto">
        <h3 class="text-xl font-bold text-gray-800">Episodes</h3>
        <div class="flex gap-2">
            <button @click="showModal = true"
                class="px-4 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded text-sm transition">+
                Create</button>
            <button @click="fetchEpisodes" :disabled="loading"
                class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm transition disabled:opacity-50">
                [[ loading ? '...' : 'Refresh' ]]
            </button>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden max-w-4xl mx-auto">
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100 border-b border-gray-200 text-sm text-gray-600">
                <tr>
                    <th class="px-4 py-3 font-semibold">Episode Name</th>
                    <th class="px-4 py-3 font-semibold w-48 text-right">Created At</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr v-for="ep in episodes" :key="ep.name" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 font-medium">
                        <a :href="'/episodes/' + encodeURIComponent(ep.name)"
                            class="text-blue-600 hover:underline font-bold">[[ ep.name ]]</a>
                    </td>
                    <td class="px-4 py-3 text-gray-500 text-sm font-mono text-right">[[ formatDateTime(ep.create_time)
                        ]]</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div v-if="showModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-80">
            <h4 class="font-bold mb-4">Create New Episode</h4>
            <input v-model="newName" @keyup.enter="createEpisode" placeholder="Name..."
                class="w-full border p-2 rounded mb-4 text-sm focus:ring-1 focus:ring-blue-500 outline-none">
            <div class="flex justify-end gap-2">
                <button @click="showModal = false"
                    class="px-3 py-1 text-sm text-gray-500 hover:bg-gray-100 rounded">Cancel</button>
                <button @click="createEpisode" :disabled="creating || !newName.trim()"
                    class="px-3 py-1 text-sm bg-blue-600 text-white rounded disabled:opacity-50">
                    [[ creating ? '...' : 'Confirm' ]]
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const { createApp, ref, onMounted } = Vue;
    createApp({
        setup() {
            const episodes = ref([]), loading = ref(false), creating = ref(false);
            const showModal = ref(false), newName = ref("");

            const formatDateTime = (ts) => {
                if (!ts) return '-';
                const d = new Date(ts * 1000);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            };

            const fetchEpisodes = async () => {
                loading.value = true;
                try {
                    const res = await fetch('/api/episodes');
                    const data = await res.json();
                    if (!res.ok || data.code !== 0) console.error(data.message || 'Fetch failed');
                    episodes.value = data.episodes_list || [];
                } catch (e) { console.error(e); }
                loading.value = false;
            };

            const createEpisode = async () => {
                if (!newName.value.trim()) return;
                creating.value = true;
                try {
                    const res = await fetch('/api/create-episode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName.value.trim() })
                    });
                    const data = await res.json();
                    if (!res.ok || data.code !== 0) alert(data.message || "创建失败");
                    else {
                        showModal.value = false;
                        newName.value = "";
                        await fetchEpisodes();
                    }
                } catch (e) { alert(e); }
                creating.value = false;
            };

            onMounted(fetchEpisodes);
            return { episodes, loading, creating, showModal, newName, fetchEpisodes, createEpisode, formatDateTime };
        },
        delimiters: ['[[', ']]']
    }).mount('#app');
</script>
{% endblock %}
