{% extends "layout.html" %}

{% block title %}Episode List{% endblock %}

{% block content %}
<div id="app" class="p-5 font-sans bg-gray-50 min-h-screen">
    <div class="flex justify-between items-center mb-6 max-w-4xl mx-auto">
        <h3 class="text-xl font-bold text-gray-800">Episodes</h3>

        <div class="flex items-center gap-2">
            <input v-model="newName" @keyup.enter="createEpisode" placeholder="New episode name..."
                class="border border-gray-300 px-3 py-1.5 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 w-48">
            <button @click="createEpisode" :disabled="creating || !newName.trim()"
                class="px-4 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded text-sm transition disabled:opacity-50">
                [[ creating ? '...' : 'Create' ]]
            </button>
            <div class="w-[1px] h-6 bg-gray-300 mx-1"></div>
            <button @click="fetchEpisodes" :disabled="loading"
                class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm transition disabled:opacity-50">
                [[ loading ? '...' : 'Refresh' ]]
            </button>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden max-w-4xl mx-auto">
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-sm font-semibold text-gray-600">Episode Name</th>
                    <th class="px-4 py-3 text-sm font-semibold text-gray-600 w-48">Created At</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr v-for="ep in episodes" :key="ep.name" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 text-gray-800 font-medium">
                        <a :href="'/episodes/' + encodeURIComponent(ep.name)"
                            class="text-blue-600 hover:text-blue-800 hover:underline font-bold">
                            [[ ep.name ]]
                        </a>
                    </td>
                    <td class="px-4 py-3 text-gray-500 text-sm font-mono">
                        [[ formatDateTime(ep.create_time) ]]
                    </td>
                </tr>
                <tr v-if="episodes.length === 0 && !loading">
                    <td colspan="2" class="px-4 py-10 text-center text-gray-400 italic">No episodes found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const episodes = ref([]);
            const loading = ref(false);
            const creating = ref(false);
            const newName = ref("");

            const formatDateTime = (ts) => {
                if (!ts) return '-';
                const date = new Date(ts * 1000);
                return date.getFullYear() + '-' +
                    String(date.getMonth() + 1).padStart(2, '0') + '-' +
                    String(date.getDate()).padStart(2, '0') + ' ' +
                    String(date.getHours()).padStart(2, '0') + ':' +
                    String(date.getMinutes()).padStart(2, '0');
            };

            const fetchEpisodes = async () => {
                loading.value = true;
                try {
                    const res = await fetch('/api/episodes');
                    const data = await res.json();
                    episodes.value = data.episodes_list || [];
                } catch (e) { console.error(e); }
                loading.value = false;
            };

            const createEpisode = async () => {
                if (!newName.value.trim()) return;
                creating.value = true;
                try {
                    const res = await fetch('/api/create-episode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName.value.trim() })
                    });
                    const data = await res.json();
                    if (data.message) {
                        alert(data.message);
                    } else {
                        newName.value = "";
                        await fetchEpisodes(); // 刷新列表
                    }
                } catch (e) { alert(e); }
                creating.value = false;
            };

            onMounted(fetchEpisodes);

            return { episodes, loading, creating, newName, fetchEpisodes, createEpisode, formatDateTime };
        },
        delimiters: ['[[', ']]']
    }).mount('#app');
</script>
{% endblock %}
