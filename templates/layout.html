<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Episode App{% endblock %}</title>
    <script src="{{ url_for('static', filename='js/tailwind-3.4.17.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vue.3.5.30.global.js') }}"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-md p-4 mb-8">
        <div class="container mx-auto flex items-center gap-6">
            <h1 class="text-xl font-bold text-gray-800">
                <a href="/">ImageAutoPrompt</a>
            </h1>
            <div class="flex gap-4 text-sm font-medium">
                <a href="/episodes" class="font-bold text-gray-600 hover:text-blue-600">Episodes</a>
                <a href="/rag" class="font-bold text-gray-600 hover:text-blue-600">RAG</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>

</html>
