<div v-if="showPasteModal"
    class="fixed inset-0 z-[150] flex items-center justify-center bg-black/70 backdrop-blur-md px-4"
    @click.self="showPasteModal = false">

    <div class="bg-white w-[90%] h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-white/20">

        <div class="px-8 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
            <div>
                <h3 class="text-xl font-black text-gray-900 tracking-tight">Go To Paste</h3>
                <p class="text-xs text-gray-500 font-medium uppercase tracking-widest mt-0.5">Image Processing Pipeline
                </p>
            </div>
            <button @click="showPasteModal = false"
                class="p-2 hover:bg-gray-200 rounded-full transition-colors text-gray-400 hover:text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="flex-1 p-8 flex flex-col min-h-0">
            <label class="block text-sm font-bold text-indigo-600 mb-3 uppercase tracking-wider flex items-center">
                <span class="mr-2">Exploration Output Content</span>
                <span class="h-[1px] flex-1 bg-indigo-100"></span>
            </label>

            <textarea v-model="pasteContent"
                class="flex-1 w-full p-6 border-2 border-gray-100 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 font-mono text-base leading-relaxed resize-none bg-gray-50/30 shadow-inner"
                placeholder="在此处粘贴您的内容... 文本框已扩容至 90% 宽度"></textarea>
        </div>

        <div class="px-8 py-5 bg-gray-50 border-t border-gray-100 flex justify-end items-center space-x-4">
            <span class="text-xs text-gray-400 font-mono mr-auto">CHARS: [[ pasteContent.length ]]</span>

            <button @click="showPasteModal = false"
                class="px-6 py-2.5 text-sm font-bold text-gray-500 hover:text-gray-700 transition-colors uppercase tracking-widest">
                Cancel
            </button>

            <button @click="submitPaste" :disabled="isSubmittingPaste"
                class="px-10 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white text-sm font-black rounded-xl shadow-[0_4px_20px_rgba(79,70,229,0.3)] transition-all flex items-center active:scale-95 uppercase tracking-widest">
                <template v-if="isSubmittingPaste">
                    <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Processing...
                </template>
                <span v-else>Submit & Process</span>
            </button>
        </div>
    </div>
</div>
