{% extends "layout.html" %}

{% block title %}RAG Simple{% endblock %}

{% block content %}
<div id="app" class="p-5 font-sans bg-gray-50 min-h-screen">
    <h3 class="text-xl font-bold mb-4">RAG Search</h3>

    <div class="mb-5 flex items-center gap-2">
        <input v-model="queryText" @keyup.enter="doSearch" placeholder="Query..."
            class="w-[300px] border border-gray-300 px-2 py-1 rounded">
        <button @click="doSearch" :disabled="loading"
            class="px-4 py-1 bg-gray-200 hover:bg-gray-300 rounded disabled:opacity-50">
            [[ loading ? '...' : 'Search' ]]
        </button>
        <span v-if="duration" class="ml-2 text-xs text-gray-500 font-mono">
            Cost: [[ duration ]]ms
        </span>
    </div>

    <div v-if="candidates.length > 0">
        <ul class="space-y-2">
            <li v-for="item in candidates" class="flex items-center gap-3">
                <code class="bg-gray-100 px-1 rounded text-sm text-blue-700">[[ item.score.toFixed(4) ]]</code>
                <b class="text-gray-800">[[ item.text ]]</b>
                <button @click="copy(item.text)"
                    class="text-[10px] border border-gray-300 px-1 rounded hover:bg-gray-100">Copy</button>
            </li>
        </ul>
    </div>

    <p v-if="toastMsg" class="fixed bottom-2 left-2 bg-yellow-200 px-2 py-1 text-sm border border-yellow-400">
        [[ toastMsg ]]
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
    const { createApp, ref } = Vue;
    createApp({
        setup() {
            const queryText = ref("");
            const candidates = ref([]);
            const loading = ref(false);
            const duration = ref(0);
            const toastMsg = ref("");

            const copy = (t) => {
                navigator.clipboard.writeText(t);
                toastMsg.value = "Copied!";
                setTimeout(() => toastMsg.value = "", 1000);
            };

            const doSearch = async () => {
                loading.value = true;
                const start = Date.now();
                try {
                    const res = await fetch('/api/show-rag', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query_text: queryText.value })
                    });
                    const data = await res.json();
                    if (!res.ok || data.code !== 0) alert(data.message || "检索失败");
                    candidates.value = data.candidates || [];
                    duration.value = Date.now() - start;
                } catch (e) { alert(e); }
                loading.value = false;
            };

            return { queryText, candidates, loading, duration, toastMsg, doSearch, copy };
        },
        delimiters: ['[[', ']]']
    }).mount('#app');
</script>
{% endblock %}
